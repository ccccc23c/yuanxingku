<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>管理原型 · 原型展示站</title>
  <link rel="stylesheet" href="/gallery.css">
  <script type="module" src="./editor.js"></script>
  <style>
    .editor { width: min(720px, 90vw); }
    .editor h2 { font-size: 1.15rem; margin-top: 28px; }
    .edit-list { display: grid; gap: 10px; margin: 12px 0; }
    .edit-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
    .edit-row input, .edit-row select, .editor button { border: 1px solid #c4d0e4; border-radius: 7px; padding: 8px 12px; background: white; color: inherit; min-width: 0; }
    .editor button { cursor: pointer; }
    .editor button:disabled { cursor: default; opacity: .6; }
    .editor .save { background: #254ba9; color: white; margin: 12px 0; }
    .edit-row select { width: 180px; max-width: 45vw; }
    .prototype-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 180px); gap: 10px; }
    .prototype-row label { display: grid; gap: 5px; }
    .prototype-row select { width: 100%; max-width: none; }
    .embedded .top, .embedded h1 { display: none; }
    .embedded .editor { width: auto; padding: 20px; }
  </style>
</head>
<body>
  <header class="top"><a class="brand" href="/">原型展示站</a></header>
  <main class="library editor">
    <h1>管理原型</h1>
    <p class="intro">编辑菜单名称和分类。保存后可本地预览，正式发布后访客才能看到修改。</p>
    <form id="editor" hidden>
      <h2>分类</h2>
      <div id="categories" class="edit-list"></div>
      <button id="add" type="button">新增分类</button>
      <h2>原型菜单</h2>
      <div id="assignments" class="edit-list"></div>
      <button class="save" type="submit">保存草稿</button>
    </form>
    <p id="status" class="message" role="status"></p>
  </main>
</body>
</html>
