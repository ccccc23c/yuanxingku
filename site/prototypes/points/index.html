<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>积分管理 · 检测总览</title>
<style>
:root {
  font: 13px/1.5 "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
  color: #2c3440;
  background: #eef0f2;
  --ink: #2c3440;
  --muted: #606b79;
  --line: #e7eaef;
  --control-border: #d8dee7;
  --table-head: #f4f6f8;

* { box-sizing: border-box; }
body { margin: 0; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .55; cursor: default; }
:is(button, input, select, textarea):focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.top { background: #fff; border-bottom: 1px solid var(--line); }
.top-inner, .container { width: calc(100% - 24px); margin-inline: auto; }
.top-inner { min-height: 44px; display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
.brand, .identity { display: flex; align-items: center; gap: 8px; }
.brand { color: var(--muted); font-size: 12px; }
.brand strong { color: var(--blue-text); }
.identity label { color: var(--muted); font-size: 12px; white-space: nowrap; }
.identity select { max-width: 100%; }
.container { padding: 8px 0 28px; }
.intro { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 8px; }
.intro h1 { font-size: 19px; margin: 0; line-height: 1.6; }
.subtitle { color: var(--muted); margin: 0; line-height: 1.55; }
.month { display: flex; align-items: center; gap: 7px; color: var(--muted); white-space: nowrap; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 9px; }
.tab { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #e3e8ef; border-radius: 5px; padding: 6px 11px; color: var(--ink); font-weight: 600; white-space: nowrap; }
.tab:hover { border-color: #b8d6f4; color: var(--blue-text); }
.tab[aria-selected=true] { background: var(--blue); border-color: var(--blue); color: #fff; }
.pill, .tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; white-space: nowrap; }
.pill { background: var(--blue-light); color: var(--blue-text); }
.tab[aria-selected=true] .pill { background: #fff; }

.panel { background: #fff; border: 1px solid #e6e9ed; border-radius: 7px; margin-bottom: 8px; overflow: hidden; }
.section-head, .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; padding: 9px 11px; }
.section-head h2 { font-size: 15px; margin: 0; }
.section-head .subtitle { font-size: 12px; margin-top: 2px; }
.toolbar { border-top: 1px solid var(--line); justify-content: flex-start; }
.controls { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
.request-filters { gap: 8px 14px; }
.request-filters input, .request-filters select { min-width: 114px; }
#header-month:empty { display: none; }
#header-month { padding: 4px 8px; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: left; }
th, td { padding: 8px 10px; border-bottom: 1px solid #edf0f3; vertical-align: middle; line-height: 1.5; }
th { font-size: 12px; font-weight: 600; color: #414d5c; background: var(--table-head); white-space: nowrap; }
th + th { box-shadow: inset 1px 0 #e8ebef; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #f5faff; }
.numeric { font-variant-numeric: tabular-nums; white-space: nowrap; }
.strong { font-weight: 600; }
.muted { color: var(--muted); }
.nowrap { white-space: nowrap; }
.reason { min-width: 112px; max-width: 370px; overflow-wrap: anywhere; }
.approval-note { min-width: 7em; max-width: 20em; white-space: pre-wrap; overflow-wrap: anywhere; }
.empty { text-align: center; padding: 24px 10px; color: var(--muted); }

input, select, textarea, .btn { border: 1px solid var(--control-border); border-radius: 4px; background: #fff; color: var(--ink); }
input, select, textarea { padding: 4px 7px; min-width: 0; }
.config-field { width: 74px; }
.unit { font-size: 11px; margin-left: 5px; color: var(--muted); white-space: nowrap; }
.btn { padding: 4px 10px; font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: #a9cdf0; color: var(--blue-text); }
.primary, .primary:hover:not(:disabled) { background: var(--blue); border-color: var(--blue); color: #fff; }
.primary:hover:not(:disabled) { background: var(--blue-text); border-color: var(--blue-text); }
.link { background: none; border: 0; padding: 1px 0; color: var(--blue-text); white-space: nowrap; }
.link:hover { text-decoration: underline; }
.reason .link, .facts .link { white-space: normal; text-align: left; }
.actions { display: flex; align-items: center; gap: 8px; }
.tag.pending { background: #fff4de; color: #865800; }
.tag.approved { background: #eaf7ef; color: var(--green); }
.tag.rejected { background: #fceef0; color: var(--red); }
.tag.direct, .tag.none { background: #f0f2f5; color: #526172; }
.points { color: var(--green); }
.money { color: var(--blue-text); }
.rule-note, .footnote { margin: 0; padding: 8px 11px; border-top: 1px solid var(--line); color: var(--muted); line-height: 1.55; }
.rule-note { background: #f4f8fd; }
details summary { cursor: pointer; }
.config details { border-top: 6px solid #eef0f2; }
.config details summary { padding: 8px 11px; font-size: 13px; font-weight: 600; }

dialog { border: 1px solid var(--line); border-radius: 7px; color: var(--ink); width: min(560px, calc(100% - 24px)); padding: 0; max-height: calc(100dvh - 24px); box-shadow: 0 14px 40px #29384932; }
dialog.wide { width: min(820px, calc(100% - 24px)); }
dialog::backdrop { background: #2533455c; }
.modal-head, .modal-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; }
.modal-head { border-bottom: 1px solid var(--line); }
.modal-head h2 { font-size: 16px; margin: 0; }
.modal-body { padding: 12px 14px; }
.modal-foot { justify-content: flex-end; border-top: 1px solid var(--line); }
.close { font-size: 18px; line-height: 1; background: none; border: 0; color: var(--muted); }
.field { display: grid; gap: 4px; margin-bottom: 10px; }
.field span { font-weight: 600; }
.field textarea { resize: vertical; min-height: 68px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 5px 12px; margin: 0 0 12px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.notification { position: fixed; right: 12px; bottom: 12px; background: #33475c; color: white; padding: 8px 12px; border-radius: 5px; z-index: 3; }

.record-field { margin-bottom: 11px; }
.record-field h3 { font-size: 13px; margin: 0 0 5px; }
.record-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.record-chip { background: #f5f8fc; border: 1px solid #dce6f2; border-radius: 4px; padding: 4px 7px; color: #435471; text-align: left; }
.record-chip strong { color: var(--blue-text); white-space: nowrap; margin-left: 5px; }
.record-chip:hover, .record-chip.linked { background: var(--blue-light); border-color: #a9cdf0; color: var(--blue-text); }
.record-summary { margin: 6px 0 0; }
.selected-records { margin: 4px 0 0; padding-left: 18px; overflow-wrap: anywhere; }
.selected-records .link { margin-left: 6px; }
#record-picker { width: min(1080px, calc(100% - 24px)); }
#record-picker::backdrop { background: #25334538; }
#record-picker .subtitle { margin-bottom: 8px; }
.picker-table { border: 1px solid var(--line); border-radius: 4px; max-height: 55dvh; }
.picker-table table { min-width: 870px; }
.picker-table th, .picker-table td { white-space: nowrap; }
.picker-table th { position: sticky; top: 0; z-index: 1; }
.picker-table td { border-right: 1px solid var(--line); }
.picker-table th:last-child, .picker-table td:last-child { position: sticky; right: 0; border-left: 1px solid var(--line); }
.picker-table th:last-child { z-index: 2; }
.picker-table td:last-child { background: #fff; }
.picker-table tr[data-record] { cursor: pointer; }
.picker-table tr[data-record]:hover td, .picker-table tr[data-record]:focus-within td, .picker-table tr.linked td { background: var(--blue-light); }
.reward-note { margin-top: 10px; padding: 8px 10px; background: #f4f8fd; border: 1px solid #e4edf7; border-radius: 4px; font-size: 12px; }
.reward-note h3 { margin: 0 0 4px; font-size: inherit; color: var(--ink); }

@media (max-width: 640px) {
  .top-inner, .container { width: calc(100% - 16px); }
  .top-inner { padding-block: 5px; }
  .section-head, .toolbar { padding-inline: 8px; }
  .tabs { gap: 5px; }
  .pair { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <div class="brand"><span>检测中心</span><span aria-hidden="true">/</span><strong>检测总览</strong></div>
  <div class="identity"><label for="role">演示身份</label><select id="role"></select></div>
</div></header>
<main class="container">

<dialog id="modal"><form id="dialog-form"></form></dialog>
<dialog id="record-picker" aria-labelledby="picker-title">

    <div class="modal-head"><h2 id="picker-title"></h2><button class="close" aria-label="关闭记录选择">×</button></div>
    <div id="picker-body" class="modal-body"></div>

const bonusEntries = id=>[
  ...rowsIn(data.requests,'submitted').filter(x=>x.person===id&&x.status==='approved').map(x=>({date:x.submitted,points:x.points})),
  ...rowsIn(data.direct,'date').filter(x=>x.person===id)
].sort((a,b)=>b.date.localeCompare(a.date));
function tierFor(total,leader,place) {
  if(leader<rewardStart||place>4||total<=6000) return null;
  if(place===1) return rewardTiers[0];
  return rewardTiers.slice(1).find(tier=>total*100>=leader*tier.percent)??null;
}
function ranking() {
  const businessScores=projectScoreHistory[month];
  if(!businessScores&&!rowsIn(data.requests,'submitted').some(x=>x.status==='approved')&&!rowsIn(data.direct,'date').length) return [];
  const result=people.map((person,index)=>{
    const projects=businessScores?.[person.id]??[];
    const business=projects.reduce((sum,[,points])=>sum+points,0);
    const additions=bonusEntries(person.id);
    const bonus=additions.reduce((sum,entry)=>sum+entry.points,0);
    return {...person,index,business,projects,additions,total:business+bonus};
  });
  result.sort((a,b)=>b.total-a.total||b.business-a.business||a.index-b.index);
  return result.map((row,index)=>({...row,place:index+1,tier:tierFor(row.total,result[0].total,index+1)}));
}

function openDialog(title,body,submit='',handler=null,wide=false) {

  box.classList.toggle('wide',wide);
  box.setAttribute('aria-labelledby','dialog-title');
  form.innerHTML=`<div class="modal-head"><h2 id="dialog-title">${title}</h2><button type="button" class="close" aria-label="关闭" data-action="close">×</button></div>
    <div class="modal-body">${body}</div><div class="modal-foot"><button type="button" class="btn" data-action="close">${submit?'取消':'关闭'}</button>
    ${submit?`<button class="btn primary" type="submit">${submit}</button>`:''}</div>`;
  form.onsubmit=event=>{
    event.preventDefault();

const noteField=(label,required=false)=>field(label,`<textarea name="note" maxlength="300" ${required?'required':''}></textarea>`);

function requestFacts(row) {
  return facts([['申请人',personName(row.person)],['提交日期',row.submitted],['积分归属月',monthOf(row.submitted)],
    ['关联记录',linkedModule(row)||'—'],

    ...(row.reviewed?[['审批日期',row.reviewed],['审批人',e(row.reviewer)],['核准入账分值',row.points?num(row.points):'—'],['审批意见',e(row.note||'—')]]:[])]);

function validateNote(form,required) {
  const input=$('dialog-form').elements.note;
  const raw=form.get('note')??'';
  if(required&&!raw.trim()) {
    input.setCustomValidity('请填写说明');
    input.reportValidity();
    input.addEventListener('input',()=>input.setCustomValidity(''),{once:true});
    return null;
  }
  return raw.trim();
}
function pickBusinessRecord(records,selectedIds=[],onSelect,multiple=false) {
  const picker=$('record-picker'),body=$('picker-body'),confirm=$('picker-confirm');
  $('picker-title').textContent=projectLabel(records[0]);
  $('picker-return').textContent=onSelect?(multiple?'取消':'返回加分'):'关闭';
  confirm.hidden=!multiple;
  const rows=records.map(record=>{
    const selected=selectedIds.includes(record.id);
    const columns=[record.order,record.customer,record.title,record.id,personName(record.person),record.samples,record.model,record.completed];
    const control=multiple?
      `<input type="checkbox" value="${e(record.id)}" aria-label="${e(recordLabel(record))}" ${selected?'checked':''}>`:
      `<button type="button" class="link" aria-label="${e((selected?'当前关联：':'关联记录：')+recordLabel(record))}">${selected?'已关联':'选择'}</button>`;
    return `<tr ${onSelect?`data-record="${e(record.id)}"`:''} class="${selected?'linked':''}">${columns.map(value=>`<td>${e(value??'—')}</td>`).join('')}
      ${onSelect?`<td>${control}</td>`:''}</tr>`;
  });
  const headers=['订单编码','客户名称','报告 / 记录名称','报告 / 记录编号','负责人','样品数量','型号','完成日期'];
  const hint=multiple?'勾选需要关联的记录，然后确认选择。':'选择一条该人员已完成的业务记录。';
  body.innerHTML=(onSelect?`<p class="subtitle">${hint}</p>`:'')+
    tbl(onSelect?[...headers,multiple?'勾选':'操作']:headers,rows);
  const scroll=body.querySelector('.scroll');
  scroll.classList.add('picker-table');
  scroll.tabIndex=0;
  scroll.setAttribute('aria-label','已完成业务记录');
  body.onclick=onSelect&&!multiple?event=>{
    const row=event.target.closest('[data-record]');
    if(!row) return;
    onSelect([row.dataset.record]);
    picker.close();
  }:null;
  body.onchange=multiple?event=>{
    event.target.closest('[data-record]').classList.toggle('linked',event.target.checked);
  }:null;
  confirm.onclick=multiple?()=>{
    onSelect([...body.querySelectorAll('input:checked')].map(input=>input.value));
    picker.close();
  }:null;
  picker.showModal();
}
function setupAssociation(person,multiple=false) {
  const groups=new Map();
  const records=completedRecords(person);
  for(const record of records) {
    const label=projectLabel(record);
    if(!groups.has(label)) groups.set(label,[]);
    groups.get(label).push(record);
  }
  const chips=[...groups].map(([label,records])=>{
    const unit=records[0].module==='内部业务'?'条':'份';
    return `<button type="button" class="record-chip" aria-haspopup="dialog" aria-controls="record-picker" data-project="${e(label)}">${e(label)}<strong>${records.length} ${unit}</strong></button>`;
  }).join('');
  const selectedIds=new Set();
  const section=$('association-field');
  const hint=chips?(multiple?'点击业务标签，可选择一条或多条记录。':'点击业务标签选择一条记录。'):person?'暂无可关联的已完成业务。':'请先选择检测人员。';
  section.innerHTML=`<h3 id="association-title">关联业务（选填）</h3><div class="record-chips">${chips}</div>
    <p class="record-summary muted" id="record-summary" aria-live="polite">${hint}</p>
    <ul class="selected-records" id="selected-records" hidden></ul>
    <button type="button" class="link" id="clear-association" hidden>清空关联</button>`;
  const clear=$('clear-association');
  const summary=$('record-summary');
  const list=$('selected-records');
  const projectChips=section.querySelectorAll('.record-chip');
  function updateSelection() {
    const selected=records.filter(record=>selectedIds.has(record.id));
    summary.textContent=selected.length?`已关联 ${selected.length} 条记录`:hint;
    list.innerHTML=selected.map(record=>`<li>${e(projectLabel(record))} · ${e(recordLabel(record))}
      <button type="button" class="link" data-remove-record="${e(record.id)}" aria-label="${e('移除 '+recordLabel(record))}">移除</button></li>`).join('');
    list.hidden=clear.hidden=!selected.length;
    projectChips.forEach(chip=>chip.classList.toggle('linked',groups.get(chip.dataset.project).some(record=>selectedIds.has(record.id))));
  }
  clear.addEventListener('click',()=>{
    selectedIds.clear();
    updateSelection();
    projectChips[0]?.focus();
  });
  list.addEventListener('click',event=>{
    const button=event.target.closest('[data-remove-record]');
    if(!button) return;
    selectedIds.delete(button.dataset.removeRecord);
    updateSelection();
    (list.querySelector('button')??projectChips[0])?.focus();
  });
  projectChips.forEach(chip=>chip.addEventListener('click',()=>{
    const recordsInProject=groups.get(chip.dataset.project);
    pickBusinessRecord(recordsInProject,[...selectedIds],ids=>{
      if(multiple) recordsInProject.forEach(record=>selectedIds.delete(record.id));
      else selectedIds.clear();
      ids.forEach(id=>selectedIds.add(id));
      updateSelection();
    },multiple);
  }));
  return ()=>[...selectedIds];
}
const associationField='<section id="association-field" class="record-field" aria-labelledby="association-title"></section>';
function newApplication() {
  if(!staff()) return;
  openDialog('新建积分申请',facts([['申请人',personName(role)],['提交日期',demoToday],['积分归属月',monthNow]])+
    associationField+
    pointsField('分值')+
    field('申请说明','<textarea name="note" maxlength="300" required placeholder="请填写申请加分的具体原因"></textarea>'),'提交申请',form=>{
      const reason=validateNote(form,true),asked=Number(form.get('points'));
      if(reason===null||!validPoints(asked)||!staff()) return false;
      const recordIds=getRecordIds();
      if(associatedRecords({person:role,recordIds}).length!==recordIds.length) return false;
      data.requests.unshift({id:idFor('A'),person:role,recordIds,asked,reason,submitted:demoToday,status:'pending'});
      month=monthNow;myFilter='all';
      notify('申请已提交，等待主管审批');

function review(id,approve) {
  const row=data.requests.find(x=>x.id===id);
  if(staff()||row?.status!=='pending') return;
  openDialog(approve?'同意积分申请':'不同意积分申请',requestFacts(row)+
    (approve?pointsField('积分',row.asked):'')+noteField(approve?'审批意见（选填）':'不同意原因',!approve),
    approve?'同意':'确认不同意',form=>{
      const note=validateNote(form,!approve),points=Number(form.get('points'));
      if(staff()||row.status!=='pending'||note===null||(approve&&!validPoints(points))) return false;
      Object.assign(row,{status:approve?'approved':'rejected',points:approve?points:0,note,reviewer:'主管',reviewed:demoToday});
      notify(approve?`已将 ${num(points)} 分计入 ${monthOf(row.submitted)}`:'审批结果已更新');
    });
}
function direct() {
  if(staff()) return;
  openDialog('主管直接加分',field('检测人员',`<select name="person" required>${option('','请选择')}${people.map(x=>option(x.id,x.name)).join('')}</select>`)+
    associationField+
    `<div class="pair">${pointsField('加分值（分）')}${field('加分时间',`<input name="date" type="date" required value="${month===monthNow?demoToday:month+'-01'}">`)}</div>`+

function rules() {
  const rows=rewardTiers.map((tier,index)=>{
    const upper=rewardTiers[index-1]?.percent;
    const threshold=index===0?`≥${rewardStart}`:`≥ ${tier.percent}%${upper?` 且 &lt; ${upper}%`:''}`;
    return `<tr><td>${tier.name}</td><td>${index===0?'第一名':'第 2–4 名'}</td><td>${threshold}</td><td>¥${tier.amount}</td></tr>`;
  });
  openDialog('月度排名奖励',tbl(['档位','适用人员','积分门槛','奖金'],rows)+
    '<section class="reward-note" aria-labelledby="reward-note-title"><h3 id="reward-note-title">提示</h3>'+
    '<p class="subtitle">当月第一名达到 10,000 分时启动奖励。仅核算前四名，且获奖者的积分须大于 6,000 分。第 2–4 名分别按占第一名积分的比例匹配档位，同一档可多人获得。</p></section>');
}

      const record=[...data.requests,...data.direct]
        .filter(row=>!staff()||row.person===role)
        .flatMap(associatedRecords).find(item=>item.id===id);
      if(record) pickBusinessRecord([record]);
      break;
    }
    case 'load-config':{
      const archive=$('archived').value;
      if(!archive) {notify('请先选择往期配置');break;}
      drafts[month]=structuredClone(data.configs[archive]);render();
      notify(`已载入 ${archive} 配置，保存后应用`);
      break;
    }
  }
});
render();
</script>
</body>
</html>
