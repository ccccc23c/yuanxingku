    {id:'A-HIST-02',person:'p2',recordId:'IN-260727-002',asked:160,reason:'核对检测标准版本并补齐记录',submitted:'2026-07-28',status:'rejected',reviewed:'2026-07-29',reviewer:'主管',note:'已按业务项目计分。'}
  ],
  direct:[{id:'D-HIST-01',person:'p4',recordId:'NT-260722-004',points:80,reason:'协助复核历史样品记录',date:'2026-07-30'}],
  configs:{'2026-07':configRows.map(([name,...values])=>name==='内部来料管理'?[1,3,4]:values)}
};
const baseline = {
  requests:[
    {id:'A-001',person:'p2',recordId:'NT-261124-003',asked:550,reason:'协助完成紧急样品的复测与结果核对',submitted:'2026-11-24',status:'pending'},
    {id:'A-002',person:'p3',recordId:'IN-261122-005',asked:180,reason:'整理检测设备操作说明并组织组内培训',submitted:'2026-11-22',status:'pending'},
    {id:'A-003',person:'p2',recordId:'IN-261118-007',asked:120,reason:'补录当月检测资料',submitted:'2026-11-18',status:'rejected',note:'该工作已包含在业务计分中。',reviewed:'2026-11-19',reviewer:'主管'},
    {id:'A-004',person:'p1',recordId:'NT-261030-006',asked:240,reason:'协助整理上一期专项检测报告',submitted:'2026-10-30',status:'pending'},
    ...historyExample.requests
  ],
  direct:[{id:'D-001',person:'p4',points:100,reason:'协助处理临时检测任务',date:'2026-11-20'},...historyExample.direct],
  configs:{'2026-10':defaultConfig,...historyExample.configs}
};
const storageKey = 'lab-score-prototype-v1';
let data = structuredClone(baseline);
try {
  const saved=localStorage.getItem(storageKey);
  if(saved) {
    data=JSON.parse(saved);
    for(const request of data.requests) {
      const example=baseline.requests.find(row=>row.id===request.id&&row.person===request.person);
      if(example) request.recordId??=example.recordId;
    }
    for(const key of ['requests','direct']) {
      data[key].push(...historyExample[key].filter(example=>!data[key].some(row=>row.id===example.id)));
    }
    data.configs={...historyExample.configs,...data.configs};
  }
} catch {}
let role='supervisor', tab='config', month=monthNow, queueFilter='all', myFilter='all';
let drafts={};
const $ = id=>document.getElementById(id);
const staff = ()=>role!=='supervisor';
const personName = id=>people.find(item=>item.id===id)?.name ?? id;
const num = val=>new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2}).format(val);
const e = val=>String(val??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const monthOf = date=>date.slice(0,7);
const save = ()=>{try {localStorage.setItem(storageKey,JSON.stringify(data));} catch {}};
const rowsIn = (rows,dateKey)=>rows.filter(row=>monthOf(row[dateKey])===month);
const idFor = prefix=>prefix+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
const validPoints = value=>Number.isSafeInteger(value)&&value>0;
const completedRecords = person=>businessRecords.filter(record=>record.person===person&&record.completed);
const recordFor = request=>completedRecords(request.person).find(record=>record.id===request.recordId);
const recordLabel = record=>`${record.id} · ${record.title}`;
const projectLabel = record=>`${record.module} · ${record.project}`;
const recordLink = record=>action(e(recordLabel(record)),'linked-record',record.id,'aria-haspopup="dialog" aria-controls="record-picker"');
const option = (value,label)=>`<option value="${e(value)}">${e(label)}</option>`;

const button = (label,type)=>`<button type="button" class="btn primary" data-action="${type}">${label}</button>`;

const heading = (title,sub='',right='')=>`<div class="section-head"><div><h2>${title}</h2>${sub&&`<p class="subtitle">${sub}</p>`}</div>${right}</div>`;
const filterBar = (id,choices)=>`<div class="toolbar controls request-filters">

</div>`;
const requestFilters = [['all','全部'],['pending','待审批'],['approved','已同意'],['rejected','不同意']];
const bonusEntries = id=>[
  ...rowsIn(data.requests,'submitted').filter(x=>x.person===id&&x.status==='approved').map(x=>({date:x.submitted,points:x.points})),
  ...rowsIn(data.direct,'date').filter(x=>x.person===id)
].sort((a,b)=>b.date.localeCompare(a.date));
function tierFor(total,leader,place) {
  if(leader<rewardStart||place>4||total<=6000) return null;
  if(place===1) return rewardTiers[0];
  return rewardTiers.slice(1).find(tier=>total*100>=leader*tier.percent)??null;
}
function ranking() {
  const businessScores=projectScoreHistory[month];
  if(!businessScores&&!rowsIn(data.requests,'submitted').some(x=>x.status==='approved')&&!rowsIn(data.direct,'date').length) return [];
  const result=people.map((person,index)=>{
    const projects=businessScores?.[person.id]??[];
    const business=projects.reduce((sum,[,points])=>sum+points,0);
    const additions=bonusEntries(person.id);
    const bonus=additions.reduce((sum,entry)=>sum+entry.points,0);
    return {...person,index,business,projects,additions,total:business+bonus};
  });
  result.sort((a,b)=>b.total-a.total||b.business-a.business||a.index-b.index);
  return result.map((row,index)=>({...row,place:index+1,tier:tierFor(row.total,result[0].total,index+1)}));

  const pending=applications.filter(x=>x.status==='pending').length;
  const records=[
    ...applications.map(x=>({...x,source:'员工申请',date:x.submitted})),
    ...rowsIn(data.direct,'date').map(x=>({...x,source:'主管直接加分',status:'direct'}))
  ].filter(x=>queueFilter==='all'||x.status===queueFilter);
  records.sort((a,b)=>Number(b.status==='pending')-Number(a.status==='pending')||b.date.localeCompare(a.date));
  const items=records.map(row=>`<tr><td class="nowrap">${row.date}</td><td class="strong nowrap">${personName(row.person)}</td><td class="nowrap">${row.source}</td>
    <td class="reason">${e(row.reason)}</td><td class="reason">${linkedModule(row)||'—'}</td><td class="numeric">${row.asked??'—'}</td>
    <td>${badge(row.status)}</td><td class="approval-note">${e(row.note||'—')}</td><td>${row.status==='pending'?
    `<div class="actions">${action('同意','approve',row.id)+action('不同意','reject',row.id)}</div>`:''}</td></tr>`);
  const savedMonths=Object.keys(data.configs).filter(x=>x<month).sort().reverse();
  const values=drafts[month]??data.configs[month]??defaultConfig;
  const configStatus=drafts[month]?'有未保存的修改':data.configs[month]?'已存档':'暂无存档，当前显示默认配置';
  let index=0;
  const groups=catalog.map(group=>{
    const configRows=group.rows.map(([name])=>{
      const rowIndex=index++;
      const fields=['计分系数','分值','预估时间'].map((label,key)=>`<td><input type="number" class="config-field" min="0" step="any" aria-label="${name} ${label}" data-row="${rowIndex}" data-col="${key}" value="${e(values[rowIndex]?.[key])}" placeholder="待填写">${key===1?`<span class="unit">分/${group.unit}</span>`:key===2?`<span class="unit">分钟/${group.unit}</span>`:''}</td>`);
      return `<tr><td class="nowrap">${name}</td><td class="nowrap">按${group.unit}</td>${fields.join('')}</tr>`;
    });
    return `<details open><summary>${group.title}</summary>${tbl(['项目','计分方式','计分系数','分值','预估时间'],configRows)}</details>`;
  });
  const statusOptions=[['all','全部'],['pending',`待审批（${pending}）`],...requestFilters.slice(2),['direct',statuses.direct]];
  return `<section class="panel">${heading('主管自主加分','审批通过后，核准分值计入申请提交月。',button('＋ 主管直接加分','direct'))}
    ${filterBar('queue-status',statusOptions)}
    ${tbl(['申请时间','员工','来源','加分说明','关联记录','申请分值','状态','审批意见','操作'],items)}</section>
    <section class="panel config">${heading('月度计分配置',`${e(month)} · ${configStatus}`)}
    <form id="config-form"><div class="toolbar controls"><label for="archived">月度积分配置存档</label>
    <select id="archived">${option('','选择往期配置')}${savedMonths.map(x=>option(x,x)).join('')}</select>
    <button type="button" class="btn" data-action="load-config">载入往期配置</button><button class="btn primary" type="submit">保存为所选月份配置</button></div>
    ${groups.join('')}</form><p class="footnote">项目得分 = 已完成数量 × 每份或每条分值 × 计分系数。系数和分值均填写后参与计分，预估时间仅作记录。</p></section>`;
}
function applyView() {
  if(!staff()) return `<section class="panel">${heading('积分申请','选择页面右上角的检测人员演示身份，体验提交申请和查看本人的记录。')}</section>`;
  const own=rowsIn(data.requests,'submitted').filter(x=>x.person===role&&(myFilter==='all'||x.status===myFilter)).sort((a,b)=>b.submitted.localeCompare(a.submitted));
  return `<section class="panel">${heading('我的积分申请',`${personName(role)}的申请记录按提交月份查询。`,button('＋ 新建申请','apply'))}
    ${month!==monthNow?`<p class="rule-note">新申请提交后会显示在 ${monthNow} 的记录中。</p>`:''}
    ${filterBar('my-status',requestFilters)}
    ${tbl(['申请时间','加分说明','关联记录','申请分值','入账分值','审批状态','审批意见'],own.map(x=>`<tr><td class="nowrap">${x.submitted}</td><td class="reason">${e(x.reason)}</td><td class="reason">${linkedModule(x)||'—'}</td><td class="numeric">${x.asked}</td><td class="numeric points">${x.points?num(x.points):'—'}</td><td>${badge(x.status)}</td><td class="approval-note">${e(x.note||'—')}</td></tr>`),'所选月份暂无符合条件的个人申请')}</section>`;
}
function rewardView() {
  const rank=ranking(), leader=rank[0]?.total??0;
  const active=leader>=rewardStart;
  const reason = row=>row.place>4?'未入围':row.total<=6000?'积分不足':!active?'未启动':'未达标';
  return `<section class="panel">${heading('月度人员积分排行','同分时先比较业务积分，仍相同则按固定人员顺序。',`<button type="button" class="btn" data-action="rules">奖励规则</button>`)}
    ${tbl(['排名','检测人员','总积分','奖励档位','核算奖金','操作'],rank.map(row=>`<tr>
    <td class="numeric strong">${row.place}</td><td class="strong nowrap">${row.name}${role===row.id?' <span class="muted">（我）</span>':''}</td>
    <td class="numeric strong">${num(row.total)}</td><td class="nowrap">${row.tier?.name??'—'}</td>
    <td>${row.tier?`<span class="strong money nowrap">¥${num(row.tier.amount)}</span>`:`<span class="tag none">${reason(row)}</span>`}</td>
    <td>${action('积分明细','score-detail',row.id)}</td></tr>`),'所选月份暂无积分数据')}
    <p class="rule-note">${active?`当月档位门槛 · ${rewardTiers.slice(1).map(tier=>`${tier.name} ≥ ${num(leader*tier.percent/100)} 分`).join(' · ')}`:'当月第一名积分达到 10,000 分才启动排名奖励。'}</p></section>`;
}
function render(focusTab=false) {
  $('role').value=role;
  $('header-month').innerHTML=tab==='reward'?monthField('查询月份'):'';
  const pending=rowsIn(data.requests,'submitted').filter(x=>x.status==='pending').length;
  const tabs=[...(!staff()?[['config','积分配置']]:[]),['apply','积分申请'],['reward','积分奖励']];
  $('tabs').innerHTML=tabs.map(([key,label])=>`<button id="tab-${key}" role="tab" aria-controls="content" aria-selected="${tab===key}" tabindex="${tab===key?0:-1}" class="tab" data-action="tab" data-id="${key}">${label}${key==='config'&&pending?`<span class="pill" title="待审批">${pending}</span>`:''}</button>`).join('');
  $('content').setAttribute('aria-labelledby','tab-'+tab);
  $('content').innerHTML=tab==='config'?configView():tab==='apply'?applyView():rewardView();
  if(tab==='config') $('queue-status').value=queueFilter;
  if(tab==='apply'&&staff()) $('my-status').value=myFilter;
  if(focusTab) $('tab-'+tab).focus();
}
let noticeTimer;
function notify(message) {
  const notice=$('notice');
  clearTimeout(noticeTimer);
  notice.textContent=message;
  notice.hidden=false;
  noticeTimer=setTimeout(()=>notice.hidden=true,3500);
}
function openDialog(title,body,submit='',handler=null,wide=false) {
  const box=$('modal'),form=$('dialog-form');
  box.classList.toggle('wide',wide);
  box.setAttribute('aria-labelledby','dialog-title');
  form.innerHTML=`<div class="modal-head"><h2 id="dialog-title">${title}</h2><button type="button" class="close" aria-label="关闭" data-action="close">×</button></div>
    <div class="modal-body">${body}</div><div class="modal-foot"><button type="button" class="btn" data-action="close">${submit?'取消':'关闭'}</button>
    ${submit?`<button class="btn primary" type="submit">${submit}</button>`:''}</div>`;
  form.onsubmit=event=>{
    event.preventDefault();
    if(!handler||handler(new FormData(form))===false) return;
    box.close();
    save();
    render();
  };
  box.showModal();
}
const field=(label,control)=>`<label class="field"><span>${label}</span>${control}</label>`;
const pointsField=(label,value='')=>field(label,`<input name="points" type="number" min="1" max="${Number.MAX_SAFE_INTEGER}" step="1" required value="${value}">`);
const noteField=(label,required=false)=>field(label,`<textarea name="note" maxlength="300" ${required?'required':''}></textarea>`);
const facts=entries=>`<dl class="facts">${entries.map(([label,value])=>`<dt>${label}</dt><dd>${value}</dd>`).join('')}</dl>`;
function associationFacts(row) {
  const record=recordFor(row);
  return [['关联模块',record?e(projectLabel(record)):'—'],['关联记录',record?recordLink(record):'—']];
}
function requestFacts(row) {
  return facts([['申请人',personName(row.person)],['提交日期',row.submitted],['积分归属月',monthOf(row.submitted)],
    ...associationFacts(row),
    ['申请分值',num(row.asked)],['申请说明',e(row.reason)],['审批状态',badge(row.status)],
    ...(row.reviewed?[['审批日期',row.reviewed],['审批人',e(row.reviewer)],['核准入账分值',row.points?num(row.points):'—'],['审批意见',e(row.note||'—')]]:[])]);
}
function validateNote(form,required) {
  const input=$('dialog-form').elements.note;
  const raw=form.get('note')??'';
  if(required&&!raw.trim()) {
    input.setCustomValidity('请填写说明');
    input.reportValidity();
    input.addEventListener('input',()=>input.setCustomValidity(''),{once:true});
    return null;
  }
  return raw.trim();
}
function pickBusinessRecord(records,selectedId,onSelect,returnLabel='返回申请') {
  const picker=$('record-picker'),body=$('picker-body');
  $('picker-title').textContent=projectLabel(records[0]);
  $('picker-return').textContent=onSelect?returnLabel:'关闭';
  const rows=records.map(record=>{
    const selected=record.id===selectedId;
    const columns=[record.order,record.customer,record.title,record.id,personName(record.person),record.samples,record.model,record.completed];
    return `<tr ${onSelect?`data-record="${e(record.id)}"`:''} class="${selected?'linked':''}">${columns.map(value=>`<td>${e(value??'—')}</td>`).join('')}
      ${onSelect?`<td><button type="button" class="link" aria-label="${e((selected?'当前关联：':'关联记录：')+recordLabel(record))}">${selected?'已关联':'选择'}</button></td>`:''}</tr>`;
  });
  const headers=['订单编码','客户名称','报告 / 记录名称','报告 / 记录编号','负责人','样品数量','型号','完成日期'];
  body.innerHTML=(onSelect?'<p class="subtitle">选择一条该人员已完成的业务记录。</p>':'')+
    tbl(onSelect?[...headers,'操作']:headers,rows);
  const scroll=body.querySelector('.scroll');
  scroll.classList.add('picker-table');
  scroll.tabIndex=0;
  scroll.setAttribute('aria-label','已完成业务记录');
  body.onclick=onSelect?event=>{
    const row=event.target.closest('[data-record]');
    if(!row) return;
    const record=records.find(item=>item.id===row.dataset.record);
    onSelect(record);
    picker.close();
  }:null;
  picker.showModal();
}
function setupAssociation(person,required) {
  const groups=new Map();
  for(const record of completedRecords(person)) {
    const label=projectLabel(record);
    if(!groups.has(label)) groups.set(label,[]);
    groups.get(label).push(record);
  }
  const chips=[...groups].map(([label,records])=>{
    const unit=records[0].module==='内部业务'?'条':'份';
    return `<button type="button" class="record-chip" aria-haspopup="dialog" aria-controls="record-picker" data-project="${e(label)}">${e(label)}<strong>${records.length} ${unit}</strong></button>`;
  }).join('');
  let selectedId;
  const section=$('association-field');
  const hint=chips?'点击业务标签选择一条记录。':person?'暂无可关联的已完成业务。':'请先选择检测人员。';
  section.innerHTML=`<h3 id="association-title">关联业务${required?'':'（选填）'}</h3><div class="record-chips">${chips}</div>
    <p class="record-summary muted" id="record-summary" aria-live="polite">${hint}</p>
    <button type="button" class="link" id="clear-association" hidden>取消关联</button>
    <p class="record-error" id="record-error" role="alert" hidden>请选择一条已完成的业务记录。</p>`;
  const clear=$('clear-association');
  const summary=$('record-summary');
  clear.addEventListener('click',()=>{
    selectedId=undefined;
    section.querySelector('.record-chip.linked')?.classList.remove('linked');
    summary.textContent=hint;
    clear.hidden=true;
  });
  section.querySelectorAll('.record-chip').forEach(chip=>chip.addEventListener('click',()=>{
    pickBusinessRecord(groups.get(chip.dataset.project),selectedId,record=>{
      selectedId=record.id;
      section.querySelector('.record-chip.linked')?.classList.remove('linked');
      chip.classList.add('linked');
      summary.textContent=`已关联 ${projectLabel(record)} · ${recordLabel(record)}`;
      clear.hidden=required;
      $('record-error').hidden=true;
    },required?'返回申请':'返回加分');
  }));
  return ()=>selectedId;
}
const associationField='<section id="association-field" class="record-field" aria-labelledby="association-title"></section>';
function newApplication() {
  if(!staff()) return;
  openDialog('新建积分申请',facts([['申请人',personName(role)],['提交日期',demoToday],['积分归属月',monthNow]])+
    associationField+
    pointsField('分值')+
    field('申请说明','<textarea name="note" maxlength="300" required placeholder="说明这条记录中申请加分的具体原因"></textarea>'),'提交申请',form=>{
      const reason=validateNote(form,true),asked=Number(form.get('points'));
      if(reason===null||!validPoints(asked)||!staff()) return false;
      const record=recordFor({person:role,recordId:getRecordId()});
      if(!record) {
        $('record-error').hidden=false;
        $('dialog-form').querySelector('.record-chip')?.focus();
        return false;
      }
      data.requests.unshift({id:idFor('A'),person:role,recordId:record.id,asked,reason,submitted:demoToday,status:'pending'});
      month=monthNow;myFilter='all';
      notify('申请已提交，等待主管审批');
    });
  const getRecordId=setupAssociation(role,true);
  if(!$('association-field').querySelector('.record-chip')) $('dialog-form').querySelector('[type="submit"]').disabled=true;
}
function review(id,approve) {
  const row=data.requests.find(x=>x.id===id);
  if(staff()||row?.status!=='pending') return;
  openDialog(approve?'同意积分申请':'不同意积分申请',requestFacts(row)+
    (approve?pointsField('积分',row.asked):'')+noteField(approve?'审批意见（选填）':'不同意原因',!approve),
    approve?'同意':'确认不同意',form=>{
      const note=validateNote(form,!approve),points=Number(form.get('points'));
      if(staff()||row.status!=='pending'||note===null||(approve&&!validPoints(points))) return false;
      Object.assign(row,{status:approve?'approved':'rejected',points:approve?points:0,note,reviewer:'主管',reviewed:demoToday});
      notify(approve?`已将 ${num(points)} 分计入 ${monthOf(row.submitted)}`:'审批结果已更新');
    });
}
function direct() {
  if(staff()) return;
  openDialog('主管直接加分',field('检测人员',`<select name="person" required>${option('','请选择')}${people.map(x=>option(x.id,x.name)).join('')}</select>`)+
    associationField+
    `<div class="pair">${pointsField('加分值（分）')}${field('加分时间',`<input name="date" type="date" required value="${month===monthNow?demoToday:month+'-01'}">`)}</div>`+
    noteField('加分说明',true),'确认加分',form=>{
      const reason=validateNote(form,true),points=Number(form.get('points')),date=form.get('date');
      const person=form.get('person'),recordId=getRecordId();
      if(staff()||reason===null||!validPoints(points)||!date||!people.some(item=>item.id===person)) return false;
      if(recordId&&!recordFor({person,recordId})) return false;
      data.direct.unshift({id:idFor('D'),person,recordId,points,reason,date});
      month=monthOf(date);queueFilter='all';
      notify(`已将 ${num(points)} 分计入 ${month}`);
    });
  let getRecordId=setupAssociation('',false);
  const person=$('dialog-form').elements.person;
  person.addEventListener('change',()=>{getRecordId=setupAssociation(person.value,false);});
}
function detailsFor(id) {
  const row=ranking().find(x=>x.id===id);
  if(!row) return;
  const entries=[
    ...row.projects.map(([project,points])=>({project,date:month,points})),
    ...row.additions.map(({date,points})=>({project:'主管自主加分',date,points}))
  ];
  openDialog(row.name+' · 积分明细',
    tbl(['项目','日期','积分'],entries.map(x=>`<tr><td class="reason">${e(x.project)}</td><td class="nowrap">${x.date}</td><td class="numeric">${num(x.points)}</td></tr>`),'所选月份暂无积分明细'),'',null,true);
}
function rules() {
  const rows=rewardTiers.map((tier,index)=>{
    const upper=rewardTiers[index-1]?.percent;
    const threshold=index===0?`≥${rewardStart}`:`≥ ${tier.percent}%${upper?` 且 &lt; ${upper}%`:''}`;
    return `<tr><td>${tier.name}</td><td>${index===0?'第一名':'第 2–4 名'}</td><td>${threshold}</td><td>¥${tier.amount}</td></tr>`;
  });
  openDialog('月度排名奖励',tbl(['档位','适用人员','积分门槛','奖金'],rows)+
    '<section class="reward-note" aria-labelledby="reward-note-title"><h3 id="reward-note-title">提示</h3>'+
    '<p class="subtitle">当月第一名达到 10,000 分时启动奖励。仅核算前四名，且获奖者的积分须大于 6,000 分。第 2–4 名分别按占第一名积分的比例匹配档位，同一档可多人获得。</p></section>');
}
function configValues() {
  const values=[];
  $('config-form').querySelectorAll('[data-row]').forEach(input=>{
    const row=Number(input.dataset.row);
    (values[row]??=[])[Number(input.dataset.col)]=input.value;
  });
  return values;
}
$('role').innerHTML=option('supervisor','主管')+people.map(x=>option(x.id,'检测人员 · '+x.name)).join('');
$('role').addEventListener('change',event=>{
  role=event.target.value;
  if(tab==='config'&&staff()) tab='apply';
  myFilter='all';
  render();
});
document.addEventListener('change',event=>{
  const {id,value}=event.target;
  if(id==='month') {
    if(value) month=value;
  } else if(id==='queue-status') {
    queueFilter=value;
  } else if(id==='my-status') {
    myFilter=value;
  } else {
    return;
  }
  render();
  $(id).focus({preventScroll:true});
});
$('content').addEventListener('input',event=>{
  if(event.target.matches('[data-row]')) drafts[month]=configValues();
});
$('content').addEventListener('submit',event=>{
  if(event.target.id!=='config-form'||staff()) return;
  event.preventDefault();
  data.configs[month]=configValues();
  delete drafts[month];
  save();render();
  notify(`已保存 ${month} 的积分配置`);
});
$('tabs').addEventListener('keydown',event=>{
  const tabs=[...$('tabs').querySelectorAll('[role=tab]')], index=tabs.indexOf(event.target);
  if(index<0||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
  event.preventDefault();
  const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:tabs.length-1))%tabs.length;
  tab=tabs[next].dataset.id;render(true);
});
document.addEventListener('click',event=>{
  const target=event.target.closest('[data-action]');
  if(!target) return;
  const {action:type,id}=target.dataset;
  switch(type) {
    case 'tab': tab=id;render(true);break;
    case 'apply':newApplication();break;
    case 'direct':direct();break;
    case 'approve':review(id,true);break;
    case 'reject':review(id,false);break;
    case 'close':$('modal').close();break;
    case 'rules':rules();break;
    case 'score-detail':detailsFor(id);break;
    case 'linked-record':{
      const row=[...data.requests,...data.direct].find(x=>x.recordId===id&&(!staff()||x.person===role));
      const record=row&&recordFor(row);
      if(record) pickBusinessRecord([record]);
      break;
    }
    case 'load-config':{
      const archive=$('archived').value;
      if(!archive) {notify('请先选择往期配置');break;}
      drafts[month]=structuredClone(data.configs[archive]);render();
      notify(`已载入 ${archive} 配置，保存后应用`);
      break;
    }
  }
});
render();
</script>
</body>
</html>
